<!DOCTYPE html>
<meta charset="utf-8">
<title>Redirecting…</title>
<script>
  (function() {
    var oldPath = window.location.pathname.replace(/^\/+/, ''); // drop leading slash
    var newUrl = 'https://pivotools.github.io/pivotools-quarto-blog/' + oldPath + window.location.search + window.location.hash;
    window.location.replace(newUrl);
  })();
</script>
